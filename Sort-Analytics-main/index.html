<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador de Algoritmos de Ordenamiento</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Sorting Visualizer</h1>
      <span class="badge">Algoritmos de ordenamiento</span>
    </header>

    <aside class="sidebar">
      <section class="group">
        <label class="group-title">Algoritmo</label>
        <select id="algo-select" class="select"></select>
        <p id="algo-desc" class="desc"></p>
        <div id="algo-complexity" class="complexity"></div>
      </section>

      <section class="group">
        <label class="group-title">
          Tamaño de datos <span id="size-val" class="value">40</span>
        </label>
        <input type="range" id="size-range" min="5" max="200" value="40" class="range" />
      </section>

      <section class="group">
        <label class="group-title">Caso</label>
        <div class="segmented" id="case-group">
          <button data-case="random" class="active">Aleatorio</button>
          <button data-case="best">Mejor</button>
          <button data-case="worst">Peor</button>
        </div>
      </section>

      <section class="group">
        <label class="group-title">Velocidad</label>
        <div class="segmented" id="speed-group"></div>
      </section>

      <section class="group actions">
        <button id="btn-play" class="btn primary">▶ Iniciar</button>
        <div class="row">
          <button id="btn-step" class="btn">Paso</button>
          <button id="btn-reset" class="btn">Reiniciar</button>
        </div>
        <button id="btn-new" class="btn ghost">🎲 Nuevos datos</button>
        <button id="btn-sound" class="btn ghost">🔊 Sonido</button>
      </section>

      <section class="group counters">
        <label class="group-title">Estadísticas</label>
        <div class="stat-row">
          <span class="stat-label">Iteraciones</span>
          <span class="stat-value" id="stat-iterations">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Comparaciones</span>
          <span class="stat-value" id="stat-comparisons">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Intercambios</span>
          <span class="stat-value" id="stat-swaps">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Ordenados</span>
          <span class="stat-value" id="stat-sorted">0 / 0</span>
        </div>
      </section>

      <section class="group legend">
        <span class="lg"><i class="dot base"></i>Normal</span>
        <span class="lg"><i class="dot compare"></i>Comparando</span>
        <span class="lg"><i class="dot swap"></i>Intercambio</span>
        <span class="lg"><i class="dot pivot"></i>Pivote</span>
        <span class="lg"><i class="dot sorted"></i>Ordenado</span>
      </section>
    </aside>

    <main class="stage">
      <div class="bars-wrap">
        <div id="bars" class="bars"></div>
      </div>
      <div id="code" class="code-panel"></div>
      <div id="complexity-chart" class="complexity-chart"></div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
